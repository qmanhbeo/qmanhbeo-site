        - generic [ref=e106]:
          - heading "The Lore of Leo" [level=2] [ref=e107]
          - paragraph [ref=e108]: "He is a Vietnamese researcher and builder whose path began in economics and slowly wandered into AI, simulations, data systems, and sustainability. What ties it all together is a simple question: how do we build tools that stay honest about the world they are meant to serve, especially when resources are scarce, trade-offs are real, and people must live with the outcomes?"
          - generic [ref=e109]:
            - heading "Chronicle of Adventures" [level=3] [ref=e110]
            - generic [ref=e111]:
              - generic [ref=e112]: "2021"
              - generic [ref=e113]: Set out from UEH in Applied Economics, following questions about systems, incentives, and how people live within them.
            - generic [ref=e114]:
              - generic [ref=e115]: "2023"
              - generic [ref=e116]: Learned the patience of research through forecasting work and time-series econometrics.
            - generic [ref=e117]:
              - generic [ref=e118]: "2024"
              - generic [ref=e119]: Entered energy and policy research at EEPSEA, and received the UEH Young Researcher Award.
            - generic [ref=e120]:
              - generic [ref=e121]: "2025"
              - generic [ref=e122]: Crossed through Xi'an and then Birmingham, where design, AI, and sustainability began to converge.
            - generic [ref=e123]:
              - generic [ref=e124]: "2025"
              - generic [ref=e125]: Worked with the SHAPE AI Challenge and brought research to ELG 2025.
            - generic [ref=e126]:
              - generic [ref=e127]: "2026"
              - generic [ref=e128]: Now building reinforcement learning worlds, agent-based economies, and data systems shaped by real constraints.
          - generic [ref=e129]:
            - heading "The Path Forward" [level=3] [ref=e130]
            - paragraph [ref=e131]: These days, that work takes the shape of reinforcement learning environments, agent-based simulations, public data pipelines, and research on sustainability, energy, and equitable resource allocation.
            - paragraph [ref=e132]: He is less interested in systems that look clever in a vacuum than in ones that can survive contact with institutions, human behaviour, imperfect data, and the friction of ordinary life.
            - paragraph [ref=e133]: That is the thread running through the scrolls on this site. AI, economics, and data are not here as trophies. They are here because they might help us see trade-offs more clearly, allocate resources more wisely, and leave a little more room for fairness than we found.
            - paragraph [ref=e135]: "\"The systems worth building are the ones that remember people must live inside their consequences.\""
