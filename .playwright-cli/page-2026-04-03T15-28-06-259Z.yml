        - generic [ref=e94]:
          - heading "The Lore of Leo" [level=2] [ref=e95]
          - paragraph [ref=e96]: "He is a Vietnamese researcher and builder whose path began in economics and slowly wandered into AI, simulations, data systems, and sustainability. What ties it all together is a simple question: how do we build tools that stay honest about the world they are meant to serve, especially when resources are scarce, trade-offs are real, and people must live with the outcomes?"
          - generic [ref=e97]:
            - heading "Chronicle of Adventures" [level=3] [ref=e98]
            - generic [ref=e99]: 2021Set out from UEH in Applied Economics, following questions about systems, incentives, and how people live within them.
            - generic [ref=e100]: 2023Learned the patience of research through forecasting work and time-series econometrics.
            - generic [ref=e101]: 2024Entered energy and policy research at EEPSEA, and received the UEH Young Researcher Award.
            - generic [ref=e102]: 2025Crossed through Xi'an and then Birmingham, where design, AI, and sustainability began to converge.
            - generic [ref=e103]: 2025Worked with the SHAPE AI Challenge and brought research to ELG 2025.
            - generic [ref=e104]: 2026Now building reinforcement learning worlds, agent-based economies, and data systems shaped by real constraints.
          - generic [ref=e105]:
            - heading "The Path Forward" [level=3] [ref=e106]
            - paragraph [ref=e107]: These days, that work takes the shape of reinforcement learning environments, agent-based simulations, public data pipelines, and research on sustainability, energy, and equitable resource allocation.
            - paragraph [ref=e108]: He is less interested in systems that look clever in a vacuum than in ones that can survive contact with institutions, human behaviour, imperfect data, and the friction of ordinary life.
            - paragraph [ref=e109]: That is the thread running through the scrolls on this site. AI, economics, and data are not here as trophies. They are here because they might help us see trade-offs more clearly, allocate resources more wisely, and leave a little more room for fairness than we found.
            - paragraph [ref=e111]: "\"The systems worth building are the ones that remember people must live inside their consequences.\""
