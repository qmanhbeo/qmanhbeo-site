              - generic [ref=e761]:
                - generic [ref=e762]:
                  - heading "Research Question" [level=5] [ref=e763]
                  - paragraph [ref=e764]: What are the downstream socioeconomic consequences when renewable energy projects arrive late to communities and households in Vietnam?
                - generic [ref=e765]:
                  - heading "Methodology" [level=5] [ref=e766]
                  - paragraph [ref=e767]: Empirical analysis of project-level delay data alongside household income, employment, and energy access records from Vietnamese provincial datasets.
                - generic [ref=e768]:
                  - heading "Key Findings" [level=5] [ref=e769]
                  - paragraph [ref=e770]: Delayed projects correlate with prolonged energy poverty, foregone local employment, and eroded public trust in the transition — costs that aggregate modelling rarely captures.
                - generic [ref=e771]:
                  - heading "Implications" [level=5] [ref=e772]
