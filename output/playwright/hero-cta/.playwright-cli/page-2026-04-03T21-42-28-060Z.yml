          - heading "The Lore of Leo" [level=2] [ref=e100]
          - paragraph [ref=e101]: "He is a Vietnamese researcher and builder whose path began in economics and slowly wandered into AI, simulations, data systems, and sustainability. What ties it all together is a simple question: how do we build tools that stay honest about the world they are meant to serve, especially when resources are scarce, trade-offs are real, and people must live with the outcomes?"
          - generic [ref=e102]:
            - heading "Chronicle of Adventures" [level=3] [ref=e103]
            - generic [ref=e104]:
              - generic [ref=e105]: "2021"
              - generic [ref=e106]: Set out from UEH in Applied Economics, following questions about systems, incentives, and how people live within them.
            - generic [ref=e107]:
              - generic [ref=e108]: "2023"
              - generic [ref=e109]: Learned the patience of research through forecasting work and time-series econometrics.
            - generic [ref=e110]:
              - generic [ref=e111]: "2024"
              - generic [ref=e112]: Entered energy and policy research at EEPSEA, and received the UEH Young Researcher Award.
            - generic [ref=e113]:
              - generic [ref=e114]: "2025"
              - generic [ref=e115]: Crossed through Xi'an and then Birmingham, where design, AI, and sustainability began to converge.
            - generic [ref=e116]:
              - generic [ref=e117]: "2025"
              - generic [ref=e118]: Worked with the SHAPE AI Challenge and brought research to ELG 2025.
            - generic [ref=e119]:
              - generic [ref=e120]: "2026"
              - generic [ref=e121]: Now building reinforcement learning worlds, agent-based economies, and data systems shaped by real constraints.
          - generic [ref=e122]:
            - heading "The Path Forward" [level=3] [ref=e123]
            - paragraph [ref=e124]: These days, that work takes the shape of reinforcement learning environments, agent-based simulations, public data pipelines, and research on sustainability, energy, and equitable resource allocation.
            - paragraph [ref=e125]: He is less interested in systems that look clever in a vacuum than in ones that can survive contact with institutions, human behaviour, imperfect data, and the friction of ordinary life.
            - paragraph [ref=e126]: That is the thread running through the scrolls on this site. AI, economics, and data are not here as trophies. They are here because they might help us see trade-offs more clearly, allocate resources more wisely, and leave a little more room for fairness than we found.
            - paragraph [ref=e128]: "\"The systems worth building are the ones that remember people must live inside their consequences.\""
